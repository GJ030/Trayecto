    </div>
    <div class="row row-2">
      <div class="field"><label for="tOdoS">Odómetro inicial</label><div class="input-unit"><input class="input num" type="number" step="0.1" min="0" id="tOdoS" value="${edit?edit.odoStart:D.vs[dv]?.odo||''}" inputmode="decimal"><span>km</span></div><div class="err" data-err="tOdoS"></div></div>
      <div class="field"><label for="tOdoE">Odómetro final</label><div class="input-unit"><input class="input num" type="number" step="0.1" min="0" id="tOdoE" value="${edit?edit.odoEnd:''}" inputmode="decimal"><span>km</span></div><div class="err" data-err="tOdoE"></div></div>

    </div>

  ${drawerFoot('tripForm',edit?'Guardar cambios':'Guardar viaje',edit&&{kind:'trip',id:edit.id})}`,edit?'#tDate':'#tOrigin');

  const setV=(id,html)=>{const el=g(id);el.innerHTML=html??'—';el.classList.toggle('empty-v',html==null);};
  const upd=()=>{
    const sv=g('tOdoS').value,ev=g('tOdoE').value,s=parseFloat(sv),e=parseFloat(ev);

  };

/* Ubica un lugar nuevo: cerca del lugar de referencia según los km del viaje (~18 px/km) y lejos de los demás pines */
function newPlacePos(name,anchor,km){
  const h=hashStr(norm(name)),a=anchor?placePos(anchor):null;
  let best=null,bestD=-1;
  for(let i=0;i<48;i++){
    let x,y;
    if(a&&km){const ang=((h%360)+i*37)*Math.PI/180,r=Math.min(380,Math.max(70,km*18))*(1+(i%4)*.08);x=a.x+Math.cos(ang)*r;y=a.y+Math.sin(ang)*r;}
    else{const hh=hashStr(norm(name)+i);x=70+hh%660;y=50+(hh>>>10)%420;}
    x=Math.max(50,Math.min(750,x));y=Math.max(40,Math.min(480,y));
    const d=Math.min(9999,...S.places.map(placeXY).filter(Boolean).map(q=>Math.hypot(q.x-x,q.y-y)));
    if(d>=90)return {x:Math.round(x),y:Math.round(y)};
    if(d>bestD){bestD=d;best={x:Math.round(x),y:Math.round(y)};}
  }
  return best;
}
function canonicalPlace(name,anchor,km){
  const n=name.trim().replace(/\s+/g,' ');const p=S.places.find(p=>norm(p.name)===norm(n));
  if(p)return p.name;
  const pos=newPlacePos(n,anchor,km);
  S.places.push({id:uid('p'),name:n,area:'',lat:null,lng:null,x:pos.x,y:pos.y,kind:'other'});
  return n;
}
function saveTrip(f,edit){
  const g=id=>f.querySelector('#'+id);let errs=[];
  const o=g('tOrigin').value.trim(),d=g('tDest').value.trim(),date=g('tDate').value,dep=g('tDep').value,arr=g('tArr').value;
  const s=parseFloat(g('tOdoS').value),e=parseFloat(g('tOdoE').value);
  const chk=(id,msg)=>{setErr(f,id,msg);if(msg)errs.push(id);};
  chk('tOrigin',o?'':'Escribe el lugar de origen.');
  chk('tDest',d?'':'Escribe el lugar de destino.');
  chk('tDate',date?'':'Elige la fecha.');
  chk('tArr',!dep||!arr?'Indica la hora de salida y de llegada.':dep===arr?'La llegada debe ser distinta a la salida.':'');
  chk('tOdoS',isFinite(s)&&s>=0?'':'Captura el odómetro inicial.');
  chk('tOdoE',!isFinite(e)?'Captura el odómetro final.':isFinite(s)&&e<=s?'Debe ser mayor al inicial.':isFinite(s)&&e-s>2000?'La distancia parece demasiado grande.':'');
  if(errs.length){g(errs[0]).focus();return;}
  const oKnown=S.places.some(p=>norm(p.name)===norm(o)),origin=canonicalPlace(o,oKnown?null:d,e-s),destination=canonicalPlace(d,origin,e-s);
  const t={id:uid('t'),date,depart:dep,arrive:arr,origin,destination,odoStart:s,odoEnd:e,vehicleId:g('tVeh').value,tag:f.querySelector('input[name=tTag]:checked')?.value||'Trabajo'};
  if(edit){
    /* actualiza en su lugar (mismo id); la ruta se regenera solo si la generó la app y cambió algo de lo que la define */
    const cur=S.trips.find(x=>x.id===edit.id);if(!cur){closeDrawer();return;}
    const sig=x=>[x.date,fromMin(toMin(x.depart)),fromMin(toMin(x.arrive)),x.origin,x.destination,+x.odoStart,+x.odoEnd].join('|');
    const moved=sig(cur)!==sig(t);
    Object.assign(cur,{...t,id:cur.id});
    if(cur.pointsSource==='auto'&&moved)cur.points=tripPoints(cur,S.places);
    save();render();closeDrawer();
    document.getElementById('row-'+cur.id)?.focus({preventScroll:true});toast('Viaje actualizado');return;
  }
  t.points=tripPoints(t,S.places);t.pointsSource='auto';
  S.trips.push(t);save();render();showTripSummary(t);toast('Viaje guardado');
}

/* ================= PNG con canvas ================= */
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}

  rr(x,76,74,42,42,12);x.fillStyle=ACC;x.fill();

  x.textBaseline='middle';x.fillStyle='#EDEDF0';x.font=`700 24px ${F}`;x.fillText('Trayecto',132,96);
  x.textAlign='right';x.fillStyle='#8A8A96';x.font=`500 20px ${F}`;x.fillText(`${cap(fmtDate(t.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))} · ${t.depart}–${t.arrive}`,W-76,96);x.textAlign='left';
  let size=54;const measure=()=>{x.font=`700 ${size}px ${F}`;return x.measureText(t.origin).width+x.measureText(t.destination).width+size*1.6;};
  while(measure()>620&&size>28)size-=2;
  x.font=`700 ${size}px ${F}`;x.fillStyle='#EDEDF0';let cx=76;const ry=196;
  x.fillText(t.origin,cx,ry);cx+=x.measureText(t.origin).width+size*.3;

  cx+=size*1.1;x.fillText(t.destination,cx,ry);
  const tagCol=t.tag==='Personal'?'#C3A6FF':'#7DB3FF';x.font=`600 18px ${F}`;const tw=x.measureText(t.tag).width;
  rr(x,76,248,tw+44,34,17);x.fillStyle=t.tag==='Personal'?'rgba(182,156,255,.14)':'rgba(108,168,255,.14)';x.fill();
  x.fillStyle=tagCol;x.beginPath();x.arc(94,265,4,0,Math.PI*2);x.fill();x.fillText(t.tag,106,266);
  x.fillStyle='#8A8A96';x.font=`500 19px ${F}`;x.fillText(`${vehName(t.vehicleId)} · odómetro ${NF1.format(t.odoStart)} → ${NF1.format(t.odoEnd)} km`,76,316);
  const MX=760,MY=136,MW=364,MH=210;

  x.strokeStyle='rgba(255,255,255,.045)';x.lineWidth=1;for(let i=MX+11;i<MX+MW;i+=22){x.beginPath();x.moveTo(i,MY);x.lineTo(i,MY+MH);x.stroke();}for(let j=MY+11;j<MY+MH;j+=22){x.beginPath();x.moveTo(MX,j);x.lineTo(MX+MW,j);x.stroke();}
  const pts=routePts(t.origin,t.destination),xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);

  x.fillStyle='#4A4A55';x.font=`500 16px ${F}`;x.fillText('Registrado sin conexión con Trayecto',76,556);
  return c;
}
function downloadTripPNG(t){
  try{const c=tripCanvas(t);const name=`trayecto-${norm(t.origin).replace(/\W+/g,'-')}-${norm(t.destination).replace(/\W+/g,'-')}-${t.date}.png`;
    if(c.toBlob)c.toBlob(b=>{if(b){download(name,b);toast('Tarjeta descargada');}else toast('No se pudo generar la imagen','err');},'image/png');

  }catch(e){toast('No se pudo generar la imagen','err');}
}
function download(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},800);
}

/* ================= Diálogo de confirmación y avisos ================= */
const modalWrap=$('#modalWrap');let modalOpen=false;
function confirmDialog({title,body,ok='Eliminar',danger=true}){
  return new Promise(res=>{
    const prev=document.activeElement;
    modalWrap.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mBody"><div class="m-ico${danger?'':' neutral'}">${icon(danger?'trash':'alert',22)}</div><h2 id="mTitle">${esc(title)}</h2><p id="mBody">${esc(body)}</p><div class="modal-actions"><button class="btn" data-m="0">Cancelar</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-m="1">${esc(ok)}</button></div></div>`;
    modalWrap.classList.add('open');modalOpen=true;
    const btns=$$('[data-m]',modalWrap);btns[0].focus();
    const done=v=>{modalWrap.classList.remove('open');modalWrap.innerHTML='';modalOpen=false;document.removeEventListener('keydown',onKey,true);if(prev&&document.contains(prev))prev.focus({preventScroll:true});res(v);};
    const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(false);}else if(e.key==='Tab'){e.preventDefault();const i=btns.indexOf(document.activeElement);btns[(i+(e.shiftKey?-1:1)+btns.length)%btns.length].focus();}};
    document.addEventListener('keydown',onKey,true);
    modalWrap.onclick=e=>{const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='1');else if(e.target===modalWrap)done(false);};
  });
}
function toast(msg,kind='ok'){
  const el=document.createElement('div');el.className='toast '+kind;el.innerHTML=`${icon(kind==='ok'?'check':'alert',16)}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},2800);
}

/* ================= Respaldo ================= */
const csvCell=v=>{const s=v==null?'':String(v);return /[",\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
const toCSV=rows=>'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function exportJSON(){
  const payload={app:'Trayecto',version:DATA_VERSION,exportedAt:new Date().toISOString(),data:{vehicles:S.vehicles,places:S.places,trips:S.trips,fuel:S.fuel,settings:{...S.settings,lastBackup:null}}};
  download(`trayecto-respaldo-${isoDate(new Date())}.json`,JSON.stringify(payload,null,2),'application/json');
  S.settings.lastBackup=new Date().toISOString();save();render();toast('Respaldo exportado');
}
function exportCSV(kind){
  if(kind==='trips'){
    const rows=[['fecha','salida','llegada','origen','destino','vehiculo','etiqueta','odometro_inicial','odometro_final','distancia_km','duracion_min','velocidad_kmh','costo_estimado_mxn']];
    [...S.trips].sort((a,b)=>tripKey(a).localeCompare(tripKey(b))).forEach(t=>rows.push([t.date,t.depart,t.arrive,t.origin,t.destination,vehName(t.vehicleId),t.tag,t.odoStart,t.odoEnd,tripKm(t).toFixed(1),tripDur(t),tripSpeed(t).toFixed(1),tripCost(t).toFixed(2)]));
    download(`trayecto-viajes-${isoDate(new Date())}.csv`,toCSV(rows),'text/csv;charset=utf-8');toast('Viajes exportados a CSV');
  }else{
    const rows=[['fecha','vehiculo','gasolinera','odometro','litros','precio_litro','total_mxn','tanque_lleno','km_l']];
    [...S.fuel].sort((a,b)=>a.date.localeCompare(b.date)||a.odometer-b.odometer).forEach(f=>rows.push([f.date,vehName(f.vehicleId),f.station,f.odometer,f.liters,f.price,fuelTotal(f).toFixed(2),f.full?'sí':'no',D.kmpl[f.id]?D.kmpl[f.id].toFixed(2):'']));
    download(`trayecto-cargas-${isoDate(new Date())}.csv`,toCSV(rows),'text/csv;charset=utf-8');toast('Cargas exportadas a CSV');
  }
}
async function importJSON(text){
  let o;try{o=JSON.parse(text);}catch(_){toast('El archivo no es un JSON válido','err');return;}
  const d=o&&(o.data||o);
  if(!d||!Array.isArray(d.trips)||!Array.isArray(d.fuel)||!Array.isArray(d.vehicles)){toast('El archivo no parece un respaldo de Trayecto','err');return;}
  const ver=+((o&&o.version)||d.version)||1;
  if(ver>DATA_VERSION){toast('El respaldo es de una versión más nueva de Trayecto','err');return;}
  const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||'').slice(0,10));
  const okTime=s=>/^\d{1,2}:\d{2}$/.test(String(s||''));
  const vehicles=d.vehicles.filter(v=>v&&v.name).map((v,i)=>({id:String(v.id||uid('v')),name:String(v.name),year:v.year?+v.year:'',plate:String(v.plate||''),fuel:String(v.fuel||'Magna'),tank:+v.tank||'',color:String(v.color||PALETTE[i%PALETTE.length])}));
  const places=(Array.isArray(d.places)?d.places:[]).filter(p=>p&&p.name).map(p=>cleanPlace(p,ver<DATA_VERSION));
  const trips=d.trips.filter(t=>t&&okDate(t.date)&&okTime(t.depart)&&okTime(t.arrive)&&isFinite(t.odoStart)&&isFinite(t.odoEnd)&&t.origin&&t.destination).map(t=>{
    const c={id:String(t.id||uid('t')),date:String(t.date).slice(0,10),depart:t.depart,arrive:t.arrive,origin:String(t.origin),destination:String(t.destination),odoStart:+t.odoStart,odoEnd:+t.odoEnd,vehicleId:String(t.vehicleId||''),tag:t.tag==='Personal'?'Personal':'Trabajo'};
    return Object.assign(c,resolvePoints(c,t.points,t.pointsSource,places));
  });
  const fuel=d.fuel.filter(f=>f&&okDate(f.date)&&isFinite(f.odometer)&&isFinite(f.liters)&&isFinite(f.price)).map(f=>({id:String(f.id||uid('f')),date:String(f.date).slice(0,10),station:String(f.station||'Sin nombre'),odometer:+f.odometer,liters:+f.liters,price:+f.price,full:f.full!==false,vehicleId:String(f.vehicleId||'')}));
  const ok=await confirmDialog({title:'¿Reemplazar tus datos?',body:`Se importarán ${trips.length} viajes, ${fuel.length} cargas, ${places.length} lugares y ${vehicles.length} vehículos. Tus datos actuales se reemplazarán.`,ok:'Importar',danger:false});
  if(!ok)return;
  const ui={...S.ui,selTrip:null,selPlace:null,selPair:null,tf:{tag:'Todos',vehicle:'all',from:'',to:''}};
  S=normalize({vehicles,places,trips,fuel,settings:Object.assign({},d.settings||{},{hints:S.settings.hints}),ui});
  if(!vehById(S.settings.defaultVehicle))S.settings.defaultVehicle=S.vehicles[0]?.id||null;
  save();applyChrome();render();toast('Respaldo importado');
}

/* ================= Eventos de contenido ================= */
/* Eliminar con confirmación; devuelven true si se eliminó (los usa también el pie del panel en modo edición) */
async function deleteTrip(id){
  const t=S.trips.find(x=>x.id===id);if(!t)return false;
  if(!await confirmDialog({title:'¿Eliminar este viaje?',body:`${t.origin} → ${t.destination}, ${fmtDate(t.date,{day:'numeric',month:'long'})}. Esta acción no se puede deshacer.`,ok:'Eliminar viaje'}))return false;
  S.trips=S.trips.filter(x=>x.id!==id);S.ui.selTrip=null;save();render();toast('Viaje eliminado');return true;
}
async function deleteFuel(id){
  const f=S.fuel.find(x=>x.id===id);if(!f)return false;
  if(!await confirmDialog({title:'¿Eliminar esta carga?',body:`${f.station}, ${fmtDate(f.date,{day:'numeric',month:'long'})} · ${MXN.format(fuelTotal(f))}. El rendimiento de las cargas cercanas se recalculará.`,ok:'Eliminar carga'}))return false;
  S.fuel=S.fuel.filter(x=>x.id!==id);save();render();toast('Carga eliminada');return true;
}
contentEl.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el||!contentEl.contains(el)||el.disabled)return;
  const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'go':go(el.dataset.view);break;
    case 'new-trip':openTripPanel();break;
    case 'new-fuel':openFuelPanel();break;
    case 'open-trip':S.ui.selTrip=id;go('viajes');break;
    case 'dash-veh':S.ui.dashVeh=id;save();render();break;
    case 'sort':{const k=el.dataset.key,s=S.ui.sort;S.ui.sort=s.key===k?{key:k,dir:s.dir==='asc'?'desc':'asc'}:{key:k,dir:['route','tag','vehicle'].includes(k)?'asc':'desc'};save();render();break;}
    case 'select-trip':{S.ui.selTrip=S.ui.selTrip===id?null:id;save();render();document.getElementById('row-'+id)?.focus({preventScroll:true});break;}
    case 'close-detail':{const sid=S.ui.selTrip;S.ui.selTrip=null;save();render();document.getElementById('row-'+sid)?.focus({preventScroll:true});break;}
    case 'filter-tag':S.ui.tf.tag=el.dataset.tag;save();render();break;
    case 'clear-filters':S.ui.tf={tag:'Todos',vehicle:'all',from:'',to:''};S.ui.q='';qEl.value='';save();render();break;
    case 'download-trip':{const t=S.trips.find(x=>x.id===id);if(t)downloadTripPNG(t);break;}
    case 'edit-trip':{const t=S.trips.find(x=>x.id===id);if(t)openTripPanel(t);break;}
    case 'delete-trip':deleteTrip(id);break;
    case 'fuel-veh':S.ui.ff=id;save();render();break;
    case 'edit-fuel':{const f=S.fuel.find(x=>x.id===id);if(f)openFuelPanel(f);break;}
    case 'delete-fuel':deleteFuel(id);break;
    case 'place-select':S.ui.selPlace=S.ui.selPlace===id?null:id;S.ui.selPair=null;render();{const f=document.getElementById('pl-'+id)&&e.target.closest('.row-btn')?document.getElementById('pl-'+id):document.getElementById('pin-'+id);f?.focus({preventScroll:true});}break;
    case 'pair-select':S.ui.selPair=S.ui.selPair===el.dataset.key?null:el.dataset.key;render();document.getElementById(el.id)?.focus({preventScroll:true});break;
    case 'clear-place':S.ui.selPlace=null;S.ui.selPair=null;render();break;
    case 'stat-tab':S.ui.statTab=el.dataset.tab;save();render();break;
    case 'veh-default':S.settings.defaultVehicle=id;save();render();toast('Vehículo predeterminado actualizado');break;
    case 'veh-delete':{const v=vehById(id);if(!v)break;const nt=S.trips.filter(t=>t.vehicleId===id).length,nf=S.fuel.filter(f=>f.vehicleId===id).length;
      if(await confirmDialog({title:`¿Eliminar ${v.name}?`,body:nt||nf?`También se eliminarán ${nt} viajes y ${nf} cargas asociadas. Esta acción no se puede deshacer.`:'Esta acción no se puede deshacer.',ok:'Eliminar vehículo'})){
        S.vehicles=S.vehicles.filter(x=>x.id!==id);S.trips=S.trips.filter(t=>t.vehicleId!==id);S.fuel=S.fuel.filter(f=>f.vehicleId!==id);
        if(S.settings.defaultVehicle===id)S.settings.defaultVehicle=S.vehicles[0]?.id||null;
        if(S.ui.tf.vehicle===id)S.ui.tf.vehicle='all';if(S.ui.ff===id)S.ui.ff='all';S.ui.selTrip=null;
        save();render();toast('Vehículo eliminado');}break;}
    case 'set-tag':S.settings.defaultTag=el.dataset.tag;save();render();break;
    case 'toggle-hints':S.settings.hints=!S.settings.hints;save();applyChrome();render();break;
    case 'toggle-collapse':S.ui.collapsed=!S.ui.collapsed;save();applyChrome();render();break;
    case 'reset-demo':if(await confirmDialog({title:'¿Restablecer datos de ejemplo?',body:'Tus viajes, cargas, lugares y vehículos actuales se reemplazarán por los datos de muestra.',ok:'Restablecer'})){const ui={...S.ui,selTrip:null,selPlace:null,selPair:null};S=normalize(Object.assign(seed(),{ui}));save();applyChrome();render();toast('Datos de ejemplo restablecidos');}break;
    case 'wipe':if(await confirmDialog({title:'¿Borrar todos los datos?',body:`Se eliminarán ${S.trips.length} viajes, ${S.fuel.length} cargas, ${S.places.length} lugares y ${S.vehicles.length} vehículos de este equipo. Te recomendamos exportar un respaldo antes.`,ok:'Borrar todo'})){const ui={...S.ui,selTrip:null,selPlace:null,selPair:null,tf:{tag:'Todos',vehicle:'all',from:'',to:''}};S=normalize({settings:{hints:S.settings.hints},ui});save();render();toast('Se borraron todos los datos');}break;
    case 'export-json':exportJSON();break;
    case 'import-json':$('#importFile')?.click();break;
    case 'csv-trips':exportCSV('trips');break;
    case 'csv-fuel':exportCSV('fuel');break;
  }
});
contentEl.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='importFile'){const file=el.files&&el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>importJSON(String(r.result));r.onerror=()=>toast('No se pudo leer el archivo','err');r.readAsText(file);el.value='';return;}
  const a=el.dataset.change;if(!a)return;
  if(a==='f-veh')S.ui.tf.vehicle=el.value;
  else if(a==='f-from')S.ui.tf.from=el.value;
  else if(a==='f-to')S.ui.tf.to=el.value;
  else if(a==='set-veh'){S.settings.defaultVehicle=el.value;toast('Vehículo predeterminado actualizado');}
  save();render();
});
contentEl.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='addPlaceForm'){
    const n=$('#plName',f).value.trim().replace(/\s+/g,' '),ar=$('#plArea',f).value.trim();
    if(!n){$('#plName',f).focus();return;}
    if(S.places.some(p=>norm(p.name)===norm(n))){toast('Ese lugar ya existe','err');return;}
    const pos=newPlacePos(n);S.places.push({id:uid('p'),name:n,area:ar,lat:null,lng:null,x:pos.x,y:pos.y,kind:'other'});save();render();toast('Lugar agregado');
  }else if(f.id==='addVehForm'){
    const n=$('#vName',f).value.trim();setErr(f,'vName',n?'':'Escribe un nombre para el vehículo.');if(!n){$('#vName',f).focus();return;}
    const v={id:uid('v'),name:n,year:+$('#vYear',f).value||'',plate:$('#vPlate',f).value.trim().toUpperCase(),fuel:$('#vFuel',f).value,tank:+$('#vTank',f).value||'',color:PALETTE[S.vehicles.length%PALETTE.length]};
    S.vehicles.push(v);if(!vehById(S.settings.defaultVehicle))S.settings.defaultVehicle=v.id;save();render();toast('Vehículo agregado');
  }
});
contentEl.addEventListener('keydown',e=>{
  const el=e.target;
  if(el.matches('tr[data-id]')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();const sib=e.key==='ArrowDown'?el.nextElementSibling:el.previousElementSibling;
    if(sib){if(S.ui.selTrip){S.ui.selTrip=sib.dataset.id;save();render();document.getElementById('row-'+sib.dataset.id)?.focus();}else sib.focus();}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&el.matches('[data-action]:not(button):not(input):not(select)')){e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});

/* ================= Atajos globales ================= */
document.addEventListener('keydown',e=>{
  if(modalOpen)return;
  const t=e.target,typing=t instanceof HTMLElement&&(t.matches('input,textarea,select')||t.isContentEditable);
  if(e.key==='Escape'){
    if(!menu.hidden){e.preventDefault();closeMenu(true);return;}
    if(drawerOpen){e.preventDefault();requestCloseDrawer();return;}
    if(t===qEl){if(qEl.value){qEl.value='';S.ui.q='';render();}else qEl.blur();return;}
    if(S.ui.view==='viajes'&&S.ui.selTrip){const id=S.ui.selTrip;S.ui.selTrip=null;save();render();document.getElementById('row-'+id)?.focus({preventScroll:true});return;}
    if(S.ui.view==='lugares'&&(S.ui.selPlace||S.ui.selPair)){S.ui.selPlace=null;S.ui.selPair=null;render();return;}
    return;
  }
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(drawerGuard&&drawerGuard()&&k.length===1&&'nge'.includes(k))return; /* con cambios sin guardar en un panel, N/G/E no lo reemplazan */
  if(k==='n'){e.preventDefault();openTripPanel();}
  else if(k==='g'){e.preventDefault();openFuelPanel();}
  else if(k==='e'){const t=!drawerOpen&&S.ui.view==='viajes'&&S.trips.find(x=>x.id===S.ui.selTrip);if(t){e.preventDefault();openTripPanel(t);}}
  else if(e.key==='/'){e.preventDefault();focusSearch();}
});

/* ================= Inicio ================= */
buildChrome();applyChrome();render(true);
window.__trayecto={get state(){return S;},get maps(){return MapReg.map(m=>({slot:m.slot,trip:m.tripId,state:m.state}));},render,go,openTripPanel,openFuelPanel};
})();
